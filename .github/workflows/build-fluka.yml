---
name: CORSIKA8-FLUKA-build

on:
  workflow_dispatch:
    inputs:
      corsika_branch:
        description: CORSIKA branch to build
        required: true
        default: compile-osx
        type: string
      image_tag:
        description: Private image tag
        required: true
        default: latest
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-fluka:
    # This workflow must remain manual and must not be enabled for pull
    # requests or fork workflows: the resulting images contain licensed code.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check FLUKA credential and resolve source revision
        id: vars
        env:
          FLUKA_ID: ${{ secrets.FLUKA_ID }}
          CORSIKA_BRANCH: ${{ inputs.corsika_branch }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "$FLUKA_ID"
          git check-ref-format --branch "$CORSIKA_BRANCH" >/dev/null
          test -n "$IMAGE_TAG"
          case "$IMAGE_TAG" in
            *[!a-zA-Z0-9._-]*) echo 'image_tag contains invalid characters' >&2; exit 1 ;;
          esac

          CORSIKA_REF=$(git ls-remote https://gitlab.iap.kit.edu/AirShowerPhysics/corsika.git \
            "refs/heads/$CORSIKA_BRANCH" | awk 'NR == 1 { print $1 }')
          test -n "$CORSIKA_REF"
          REPOSITORY_NAME=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "corsika-ref=$CORSIKA_REF"
            echo "repository-name=$REPOSITORY_NAME"
            echo "image-name=$REPOSITORY_NAME-fluka"
            echo "image-tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to private GHCR packages
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push matching private toolchain image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.toolchain
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image-name }}-toolchain:ref-${{ steps.vars.outputs.corsika-ref }}
          build-args: |
            PYTHON_VERSION=3.12
            CORSIKA_REF=${{ steps.vars.outputs.corsika-ref }}

      - name: Build and push private FLUKA development image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: builder
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image-name }}-dev:${{ steps.vars.outputs.image-tag }}
          build-args: |
            FLUKA=ON
            BUILD_JOBS=2
            CORSIKA_REF=${{ steps.vars.outputs.corsika-ref }}
            CORSIKA_TOOLCHAIN_IMAGE=${{ env.REGISTRY }}/${{ steps.vars.outputs.image-name }}-toolchain:ref-${{ steps.vars.outputs.corsika-ref }}
          secrets: |
            fluka-id=${{ secrets.FLUKA_ID }}

      - name: Build and push private FLUKA runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image-name }}:${{ steps.vars.outputs.image-tag }}
          build-args: |
            FLUKA=ON
            BUILD_JOBS=2
            PYTHON_VERSION=3.12
            CORSIKA_REF=${{ steps.vars.outputs.corsika-ref }}
            CORSIKA_TOOLCHAIN_IMAGE=${{ env.REGISTRY }}/${{ steps.vars.outputs.image-name }}-toolchain:ref-${{ steps.vars.outputs.corsika-ref }}
          secrets: |
            fluka-id=${{ secrets.FLUKA_ID }}

      - name: Verify pushed GHCR packages are private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.vars.outputs.image-name }}
        run: |
          set -euo pipefail
          package_root="${IMAGE_NAME##*/}"
          for package in "$package_root" "${package_root}-dev" "${package_root}-toolchain"; do
            visibility=$(gh api \
              "/user/packages/container/${package}/visibility" \
              --jq '.visibility')
            test "$visibility" = private || {
              echo "GHCR package $package is $visibility; refusing to continue" >&2
              exit 1
            }
          done
