---
name: CORSIKA8-build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      corsika_branch:
        description: 'CORSIKA branch to build'
        required: false
        default: 'master'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      runtime-image-tag: ${{ steps.meta-runtime.outputs.tags }}
      dev-image-tag: ${{ steps.meta-dev.outputs.tags }}
      image-digest: ${{ steps.build-runtime.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set CORSIKA branch and image name
        id: vars
        run: |
          CORSIKA_BRANCH="${{ github.event.inputs.corsika_branch || 'master' }}"
          echo "corsika-branch=$CORSIKA_BRANCH" >> $GITHUB_OUTPUT

          if [ "$CORSIKA_BRANCH" != "master" ]; then
            # Sanitize branch name for Docker tag (replace / with -)
            BRANCH_SAFE=$(echo "$CORSIKA_BRANCH" | sed 's/\//-/g')
            IMAGE_NAME="${{ env.IMAGE_NAME }}-corsika-$BRANCH_SAFE"
          else
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
          fi
          echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for runtime image
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=CORSIKA8 Runtime
            org.opencontainers.image.description=CORSIKA8 runtime image with branch ${{ steps.vars.outputs.corsika-branch }}
            corsika.branch=${{ steps.vars.outputs.corsika-branch }}
            corsika.image-type=runtime

      - name: Extract metadata for development image
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image-name }}-dev
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=CORSIKA8 Development
            org.opencontainers.image.description=CORSIKA8 development image with branch ${{ steps.vars.outputs.corsika-branch }}
            corsika.branch=${{ steps.vars.outputs.corsika-branch }}
            corsika.image-type=development

      - name: Build and push development image
        id: build-dev
        uses: docker/build-push-action@v5
        with:
          context: .
          target: builder
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FLUKA=OFF
            PYTHON_VERSION=3.12
            CORSIKA_BRANCH=${{ steps.vars.outputs.corsika-branch }}

      - name: Build and push runtime image
        id: build-runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FLUKA=OFF
            PYTHON_VERSION=3.12
            CORSIKA_BRANCH=${{ steps.vars.outputs.corsika-branch }}

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: |
          # Use development image for testing since it contains the build directory
          IMAGE_TAG=$(echo "${{ needs.build.outputs.dev-image-tag }}" | head -n1)
          docker run --rm $IMAGE_TAG bash -c "cd /workdir/corsika-build && ctest -j4"
