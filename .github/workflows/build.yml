---
name: CORSIKA8-build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      corsika_branch:
        description: 'CORSIKA branch to build'
        required: false
        default: 'main'
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  gitwork:
    runs-on: ubuntu-24.04
    outputs:
      corsika-branch: ${{ steps.vars.outputs.corsika-branch }}
      corsika-ref: ${{ steps.vars.outputs.corsika-ref }}
    permissions:
      contents: read

    steps:
      - name: Resolve CORSIKA revision
        id: vars
        env:
          REQUESTED_CORSIKA_BRANCH: ${{ github.event.inputs.corsika_branch || 'main' }}
        run: |
          set -euo pipefail
          CORSIKA_BRANCH="$REQUESTED_CORSIKA_BRANCH"
          git check-ref-format --branch "$CORSIKA_BRANCH" > /dev/null
          CORSIKA_REF=$(git ls-remote https://gitlab.iap.kit.edu/AirShowerPhysics/corsika.git "refs/heads/$CORSIKA_BRANCH" | awk 'NR == 1 { print $1 }')
          test -n "$CORSIKA_REF"
          echo "corsika-branch=$CORSIKA_BRANCH" >> "$GITHUB_OUTPUT"
          echo "corsika-ref=$CORSIKA_REF" >> "$GITHUB_OUTPUT"

      - name: Download CORSIKA source
        env:
          CORSIKA_REF: ${{ steps.vars.outputs.corsika-ref }}
        run: |
          set -euo pipefail
          CORSIKA_DIR="$RUNNER_TEMP/corsika"
          git init "$CORSIKA_DIR"
          git -C "$CORSIKA_DIR" remote add origin https://gitlab.iap.kit.edu/AirShowerPhysics/corsika.git
          git -C "$CORSIKA_DIR" fetch --depth 1 origin "$CORSIKA_REF"
          git -C "$CORSIKA_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$CORSIKA_DIR" rev-parse HEAD)" = "$CORSIKA_REF"
          git -C "$CORSIKA_DIR" submodule update --init --recursive --depth 1
          sed -i \
            -e 's#https://pythia.org/download/pythia83#https://pythia.org/releases/pythia83#g' \
            -e 's#\.tar\.bz2#.tgz#g' \
            -e 's#faf2730a959369e4d25e1285ab70d915#6fbe60db1514778e94a671e9a75c654e#g' \
            "$CORSIKA_DIR/modules/pythia8/CMakeLists.txt"
          tar -czf "$RUNNER_TEMP/corsika-source.tar.gz" -C "$RUNNER_TEMP" corsika

      - name: Upload CORSIKA source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: corsika-source
          path: ${{ runner.temp }}/corsika-source.tar.gz
          if-no-files-found: error

  build:
    needs: gitwork
    runs-on: ubuntu-24.04
    outputs:
      runtime-image-tag: ${{ steps.meta-runtime.outputs.tags }}
      dev-image-tag: ${{ steps.meta-dev.outputs.tags }}
      image-digest: ${{ steps.build-runtime.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download CORSIKA source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: corsika-source
          path: ${{ runner.temp }}/corsika-source

      - name: Remove stale CORSIKA source tree
        run: rm -rf "$GITHUB_WORKSPACE/corsika"

      - name: Extract CORSIKA source
        run: tar -xzf "$RUNNER_TEMP/corsika-source/corsika-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Set CORSIKA branch and image name
        id: vars
        env:
          CORSIKA_BRANCH: ${{ needs.gitwork.outputs.corsika-branch }}
          CORSIKA_REF: ${{ needs.gitwork.outputs.corsika-ref }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$CORSIKA_BRANCH" > /dev/null
          echo "corsika-branch=$CORSIKA_BRANCH" >> "$GITHUB_OUTPUT"
          echo "corsika-ref=$CORSIKA_REF" >> "$GITHUB_OUTPUT"

          REPOSITORY_NAME=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repository-name=$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"

          if [ "$CORSIKA_BRANCH" != "main" ]; then
            # A Git branch may contain characters that are illegal in an image
            # repository name. Keep a readable slug and a hash to avoid collisions.
            BRANCH_SLUG=$(printf '%s' "$CORSIKA_BRANCH" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-' | sed 's/^[._-]*//; s/[._-]*$//' | cut -c1-48)
            test -n "$BRANCH_SLUG"
            BRANCH_HASH=$(printf '%s' "$CORSIKA_BRANCH" | sha256sum | cut -c1-12)
            IMAGE_NAME="$REPOSITORY_NAME-corsika-$BRANCH_SLUG-$BRANCH_HASH"
          else
            IMAGE_NAME="$REPOSITORY_NAME"
          fi
          echo "image-name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "cache-scope=corsika-$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for runtime image
        id: meta-runtime
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=CORSIKA8 Runtime
            org.opencontainers.image.description=CORSIKA8 runtime image with branch ${{ steps.vars.outputs.corsika-branch }}
            corsika.branch=${{ steps.vars.outputs.corsika-branch }}
            corsika.image-type=runtime

      - name: Extract metadata for toolchain image
        id: meta-toolchain
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.repository-name }}-toolchain
          tags: |
            type=raw,value=ref-${{ steps.vars.outputs.corsika-ref }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.corsika-branch == 'main' }}
          labels: |
            org.opencontainers.image.title=CORSIKA8 Toolchain
            org.opencontainers.image.description=Reusable CORSIKA8 compiler and Conan toolchain
            corsika.ref=${{ steps.vars.outputs.corsika-ref }}
            corsika.branch=${{ steps.vars.outputs.corsika-branch }}
            corsika.image-type=toolchain

      - name: Extract metadata for development image
        id: meta-dev
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image-name }}-dev
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=CORSIKA8 Development
            org.opencontainers.image.description=CORSIKA8 development image with branch ${{ steps.vars.outputs.corsika-branch }}
            corsika.branch=${{ steps.vars.outputs.corsika-branch }}
            corsika.image-type=development

      - name: Build and push toolchain image
        id: build-toolchain
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.toolchain
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-toolchain.outputs.tags }}
          labels: ${{ steps.meta-toolchain.outputs.labels }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
          build-args: |
            PYTHON_VERSION=3.12
            CORSIKA_REF=${{ steps.vars.outputs.corsika-ref }}

      - name: Build and push development image
        id: build-dev
        uses: docker/build-push-action@v7
        with:
          context: .
          target: builder
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          # Both targets share this cache. The runtime build therefore reuses
          # the already-solved builder stage.
          cache-from: type=gha,scope=${{ steps.vars.outputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.vars.outputs.cache-scope }}
          build-args: |
            FLUKA=OFF
            BUILD_JOBS=2
            CORSIKA_REF=${{ steps.vars.outputs.corsika-ref }}
            CORSIKA_TOOLCHAIN_IMAGE=${{ env.REGISTRY }}/${{ steps.vars.outputs.repository-name }}-toolchain@${{ steps.build-toolchain.outputs.digest }}

      - name: Build and push runtime image
        id: build-runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.vars.outputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.vars.outputs.cache-scope }}
          build-args: |
            FLUKA=OFF
            BUILD_JOBS=2
            PYTHON_VERSION=3.12
            CORSIKA_REF=${{ steps.vars.outputs.corsika-ref }}
            CORSIKA_TOOLCHAIN_IMAGE=${{ env.REGISTRY }}/${{ steps.vars.outputs.repository-name }}-toolchain@${{ steps.build-toolchain.outputs.digest }}

  build-osx:
    needs: gitwork
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download CORSIKA source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: corsika-source
          path: ${{ runner.temp }}/corsika-source

      - name: Remove stale CORSIKA source tree
        run: rm -rf "$GITHUB_WORKSPACE/corsika"

      - name: Extract CORSIKA source
        run: tar -xzf "$RUNNER_TEMP/corsika-source/corsika-source.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Install macOS build dependencies
        run: |
          brew install cmake gcc
          python3 -m venv "$RUNNER_TEMP/corsika-venv"
          "$RUNNER_TEMP/corsika-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/corsika-venv/bin/pip" install "conan>=2.20.0" numpy==2.3 particle==0.25.1

      - name: Compile and test CORSIKA
        run: |
          export PATH="$RUNNER_TEMP/corsika-venv/bin:$PATH"

          export CONAN_HOME="$HOME/.conan2"
          conan profile detect --force
          conan profile detect --force --name corsika8
          sed -i '' \
            -e 's/^compiler\.cppstd=.*/compiler.cppstd=gnu17/' \
            -e 's/^compiler\.libcxx=.*/compiler.libcxx=libc++/' \
            "$CONAN_HOME/profiles/corsika8"
          conan install "$PWD/corsika" \
            --output-folder="$PWD/corsika/conan_cmake" \
            --build=missing \
            --settings=build_type=Release \
            --profile:host=corsika8 \
            --profile:build=corsika8

          cmake -S corsika -B corsika-build \
            -D CONAN_CMAKE_DIR="$PWD/corsika/conan_cmake" \
            -D CMAKE_TOOLCHAIN_FILE="$PWD/corsika/conan_cmake/conan_toolchain.cmake" \
            -D CMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -D CMAKE_BUILD_TYPE=Release \
            -D WITH_FLUKA=OFF \
            -D CMAKE_INSTALL_PREFIX="$PWD/corsika-install"
          BUILD_JOBS=$(sysctl -n hw.ncpu)
          cmake --build corsika-build --parallel "$BUILD_JOBS"
          cmake --install corsika-build

      - name: Run macOS unit tests
        run: |
          BUILD_JOBS=$(sysctl -n hw.ncpu)
          ctest --test-dir corsika-build --output-on-failure --parallel "$BUILD_JOBS"

      - name: Upload macOS test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: macos-test-results
          path: corsika-build/**/junit-*.xml
          if-no-files-found: warn

      - name: Run macOS shower test
        env:
          CORSIKA_DATA: ${{ github.workspace }}/corsika-install/share/corsika/data
        run: |
          ./corsika-install/bin/c8_air_shower \
            --pdg 2212 -E 100. -f proton_shower

  unit-tests-dev:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: |
          IMAGE_TAG=$(echo "${{ needs.build.outputs.dev-image-tag }}" | head -n1)
          mkdir -p ctest-diagnostics
          docker run --rm \
            -v "$PWD/ctest-diagnostics:/diagnostics" \
            "$IMAGE_TAG" bash -o pipefail -c '
              cd /workdir/corsika-build
              {
                echo "=== Toolchain ==="
                cmake --version
                c++ --version
                gfortran --version || true
                conan --version || true
                echo "=== CMake cache ==="
                grep -E "^(CMAKE_(C|CXX|Fortran)_COMPILER|CMAKE_BUILD_TYPE):" CMakeCache.txt || true
              } 2>&1 | tee /diagnostics/environment.log

              set +e
              ctest -j2 --output-on-failure 2>&1 | tee /diagnostics/ctest.log
              test_status=${PIPESTATUS[0]}
              if [ "$test_status" -ne 0 ]; then
                echo "=== Verbose rerun of failed tests ===" | tee /diagnostics/rerun-failed.log
                ctest --rerun-failed -j1 -VV 2>&1 | tee -a /diagnostics/rerun-failed.log || true
                cp Testing/Temporary/LastTest.log /diagnostics/LastTest.log 2>/dev/null || true
                if [ -d test_outputs ]; then
                  cp -a test_outputs /diagnostics/junit
                  echo "=== JUnit failures ===" | tee /diagnostics/junit-failures.log
                  grep -R -n -E "<(failure|error)( |>)" test_outputs \
                    | tee -a /diagnostics/junit-failures.log || true
                fi
              fi
              exit "$test_status"
            '

      - name: Upload CTest diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ctest-diagnostics
          path: ctest-diagnostics
          if-no-files-found: warn

  shower-tests:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Shower simulations
        run: |
          # Exercise the runtime image; the development image is covered by ctest.
          # metadata-action can emit several tags; use its first (canonical) tag.
          IMAGE_TAG=$(echo "${{ needs.build.outputs.runtime-image-tag }}" | head -n1)
          test -n "$IMAGE_TAG"
          docker run --rm "$IMAGE_TAG" bash -c \
          "cd /workdir/corsika-install/bin && ./c8_air_shower --pdg 2212 -E 100. -f proton_shower"
